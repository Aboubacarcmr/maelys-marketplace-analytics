# Architecture de repli pédagogique. N’utilisez pas -v avec docker compose down.
name: maelys-marketplace-analytics
services:
  postgres-airflow:
    restart: unless-stopped
    image: postgres:18
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
    - pg-airflow-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 15
  postgres-dwh:
    restart: unless-stopped
    image: postgres:18
    environment:
      POSTGRES_USER: ${DWH_USER}
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: dwh
    ports:
    - 127.0.0.1:5433:5432
    volumes:
    - pg-dwh-data:/var/lib/postgresql
    - ./init-db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DWH_USER} -d dwh
      interval: 10s
      timeout: 5s
      retries: 15
  minio:
    restart: unless-stopped
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - silo
      - healthcheck
      - ready
      interval: 10s
      timeout: 5s
      retries: 15
  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -c
    command:
    - mcli alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mcli mb --ignore-existing local/data-lake
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  api-marketplace:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MARKETPLACE_API_TOKEN: ${MARKETPLACE_API_TOKEN}
    ports:
    - 127.0.0.1:5000:5000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=4)
      interval: 10s
      timeout: 5s
      retries: 12
  airflow-init:
    build: &id001
      context: .
      dockerfile: Dockerfile.airflow
    image: maelys-airflow:3.1.8
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type":"http","host":"http://api-marketplace:5000","password":"${MARKETPLACE_API_TOKEN}"}'
      AIRFLOW_CONN_POSTGRES_DWH: postgresql://${DWH_USER}:${DWH_PASSWORD}@postgres-dwh:5432/dwh
      AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: /opt/airflow:/opt/airflow/plugins
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: postgresql+asyncpg://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
    volumes: &id002
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
    - -c
    - set -e; airflow db migrate; airflow users create --username "$${AIRFLOW_ADMIN_USER}"
      --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Admin --lastname Maelys
      --role Admin --email admin@maelys.local || true
  airflow-apiserver:
    restart: unless-stopped
    build: *id001
    image: maelys-airflow:3.1.8
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type":"http","host":"http://api-marketplace:5000","password":"${MARKETPLACE_API_TOKEN}"}'
      AIRFLOW_CONN_POSTGRES_DWH: postgresql://${DWH_USER}:${DWH_PASSWORD}@postgres-dwh:5432/dwh
      AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: /opt/airflow:/opt/airflow/plugins
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: postgresql+asyncpg://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
    volumes: *id002
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
    - 127.0.0.1:8080:8080
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8080/api/v2/monitor/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
  airflow-scheduler:
    restart: unless-stopped
    build: *id001
    image: maelys-airflow:3.1.8
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type":"http","host":"http://api-marketplace:5000","password":"${MARKETPLACE_API_TOKEN}"}'
      AIRFLOW_CONN_POSTGRES_DWH: postgresql://${DWH_USER}:${DWH_PASSWORD}@postgres-dwh:5432/dwh
      AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: /opt/airflow:/opt/airflow/plugins
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: postgresql+asyncpg://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
    volumes: *id002
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-marketplace:
        condition: service_healthy
    command: scheduler
  airflow-dag-processor:
    restart: unless-stopped
    build: *id001
    image: maelys-airflow:3.1.8
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type":"http","host":"http://api-marketplace:5000","password":"${MARKETPLACE_API_TOKEN}"}'
      AIRFLOW_CONN_POSTGRES_DWH: postgresql://${DWH_USER}:${DWH_PASSWORD}@postgres-dwh:5432/dwh
      AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: /opt/airflow:/opt/airflow/plugins
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: postgresql+asyncpg://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
    volumes: *id002
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
  airflow-triggerer:
    restart: unless-stopped
    build: *id001
    image: maelys-airflow:3.1.8
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type":"http","host":"http://api-marketplace:5000","password":"${MARKETPLACE_API_TOKEN}"}'
      AIRFLOW_CONN_POSTGRES_DWH: postgresql://${DWH_USER}:${DWH_PASSWORD}@postgres-dwh:5432/dwh
      AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: /opt/airflow:/opt/airflow/plugins
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: postgresql+asyncpg://airflow:${AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
    volumes: *id002
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
  metabase:
    restart: unless-stopped
    image: metabase/metabase:v0.59.31.x
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: -Xmx768m
    depends_on:
      postgres-dwh:
        condition: service_healthy
volumes:
  pg-airflow-data: null
  pg-dwh-data: null
  minio-data: null
  metabase-data: null
